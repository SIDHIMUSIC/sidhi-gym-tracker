<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>try{if(localStorage.getItem("sidhi-gym-token"))document.documentElement.classList.add("stay");}catch(e){}</script>
  <style>html.stay #gate{display:none!important}html.stay #app{display:block!important}html.stay #tabbar{display:flex!important}</style>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sidhi Gym • by Harry</title>
  <meta name="theme-color" content="#02040c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Pacifico&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --gold:#f0c27a; --gold2:#c9923d; --mint:#63e2b3; --text:#f6f1e8; --muted:#9aa7b8; --line:rgba(255,255,255,.14); --bg:#02040c; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin:0; min-height:100%; min-height:100dvh; color:var(--text); font-family:Comfortaa,system-ui,sans-serif; background:var(--bg); }
    #fx { position:fixed; inset:0; z-index:0; pointer-events:none; }
    .layer { position:relative; z-index:1; }
    h1,h2,.brand { font-family:Syne,Comfortaa,sans-serif; letter-spacing:.02em; }
    .brand { margin:0; font-size:26px; line-height:1; }
    .brand span { background:linear-gradient(90deg,#ff8bd4,#f0c27a,#63e2b3,#7ab8ff); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .sub { color:var(--muted); margin:6px 0 0; }
    .hello { font-family:Pacifico,cursive; font-size:22px; line-height:1.3; margin:6px 0 0; background:linear-gradient(90deg,#ff8bd4,#f0c27a,#63e2b3,#7ab8ff,#ff8bd4); background-size:200% auto; -webkit-background-clip:text; background-clip:text; color:transparent; animation: flow 6s linear infinite; }
    @keyframes flow { to { background-position:200% center; } }
    .glass { background:rgba(16,24,34,.42); backdrop-filter:blur(18px) saturate(160%); border:1px solid var(--line); border-radius:28px; box-shadow:0 10px 40px #0005, inset 0 1px 0 rgba(255,255,255,.08); }
    .card { padding:16px; margin:0 0 14px; }
    .btn { border:0; border-radius:999px; min-height:52px; padding:14px 18px; cursor:pointer; font:700 14px Comfortaa,sans-serif; letter-spacing:.06em; color:#120d06; background:linear-gradient(135deg,#ff9a9e,#fad0c4,#f0c27a); box-shadow:0 8px 20px #ff9a9e44; }
    .btn.ghost { background:rgba(255,255,255,.08); color:#fff; border:1px solid rgba(255,255,255,.18); box-shadow:none; }
    .btn.ok { color:#04140d; background:linear-gradient(135deg,#a8edea,#63e2b3,#7ab8ff); box-shadow:0 8px 20px #63e2b344; }
    .btn.danger { background:linear-gradient(135deg,#ff6b6b,#c0392b); color:#fff; min-height:44px; padding:10px 12px; }
    .btn.full { flex:1; width:100%; }
    label { display:block; font-size:12px; letter-spacing:.08em; color:#d7c4ff; margin:10px 0 6px; }
    input, textarea, select { width:100%; padding:14px 13px; border-radius:16px; border:1px solid var(--line); background:rgba(8,14,22,.55); color:var(--text); font:inherit; }
    textarea { min-height:70px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .pill { display:inline-flex; align-items:center; gap:6px; padding:7px 12px; border-radius:999px; background:rgba(240,194,122,.12); color:var(--gold); font-weight:800; font-size:13px; }
    .off { color:#ffd4d4; background:rgba(90,30,30,.45); }
    .delta.up { color:#ff8b8b; } .delta.down { color:var(--mint); }
    .today-box { font-size:24px; font-weight:800; margin:8px 0 0; }
    .hero-kg { font:800 42px Comfortaa,sans-serif; margin:4px 0; background:linear-gradient(90deg,#ff8bd4,#f0c27a,#63e2b3); -webkit-background-clip:text; background-clip:text; color:transparent; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th,td { text-align:left; padding:10px 6px; border-bottom:1px solid var(--line); }
    .hidden { display:none !important; }
    .gate { min-height:100vh; min-height:100dvh; display:grid; place-items:center; padding:22px 14px; background:#02040c; }
    .gate .card { width:min(400px,100%); padding:24px 20px 18px; background:rgba(6,10,22,.78); border:1px solid rgba(56,189,248,.22); }
    #gate .row.auth-actions { flex-direction:column; gap:12px; margin-top:16px; }
    #gate #loginBtn, #gate #setupBtn { width:100%; flex:none; }
    #gate #loginBtn { min-height:58px; background:linear-gradient(180deg,#bae6fd,#38bdf8 55%,#0ea5e9); color:#041018; letter-spacing:.16em; text-transform:uppercase; font:800 15px Syne,Comfortaa,sans-serif; }
    #gate #setupBtn { min-height:52px; background:rgba(8,16,32,.35); color:#e0f2fe; }
    #gate #gateHint { text-align:center; margin:0 0 14px; color:#93c5fd; }
    #gate .forgot { display:inline-flex; align-items:center; gap:6px; margin:8px 0 0; padding:0; border:0; background:none; color:#93c5fd; font:700 12px Comfortaa,sans-serif; }
    .step { width:28px; height:28px; border-radius:50%; display:inline-grid; place-items:center; font:800 13px Syne,sans-serif; color:#120d06; background:linear-gradient(180deg,var(--gold),var(--gold2)); margin-right:8px; }
    h2 { margin:0 0 10px; font-size:17px; display:flex; align-items:center; color:#ffe4b5; }
    .tabbar { position:fixed; left:10px; right:10px; bottom:8px; z-index:15; display:flex; justify-content:space-around; padding:8px 6px calc(8px + env(safe-area-inset-bottom)); background:rgba(10,16,24,.72); backdrop-filter:blur(18px); border:1px solid var(--line); border-radius:28px; }
    .tab { flex:1; background:none; border:0; color:var(--muted); font:700 10px Comfortaa,sans-serif; padding:6px 0; border-radius:18px; min-height:44px; }
    .tab.on { color:#120d06; background:linear-gradient(135deg,#ff9a9e,#f0c27a,#63e2b3); }
    .toast { position:fixed; bottom:92px; left:50%; transform:translateX(-50%); background:rgba(20,32,44,.9); border:1px solid var(--gold); color:var(--gold); padding:10px 14px; border-radius:999px; display:none; z-index:20; pointer-events:none; }
    .wrap { max-width:860px; margin:0 auto; padding:14px 14px 118px; }
    .actions { position:sticky; bottom:86px; z-index:8; display:flex; gap:8px; padding:10px 0; }
    .stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
    .stat { text-align:center; padding:12px 6px; }
    .stat b { display:block; font:800 16px Comfortaa,sans-serif; color:var(--gold); }
    .stat span { font-size:11px; color:#d7c4ff; }
    .cal { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; text-align:center; }
    .cal .c { aspect-ratio:1; border-radius:50%; display:grid; place-items:center; font-size:12px; background:rgba(255,255,255,.04); }
    .cal .c.done { background:#1e8a55; color:#fff; }
    .cal .c.today { outline:2px solid var(--gold); }
    .creator { margin-top:18px; padding-top:14px; border-top:1px solid var(--line); text-align:center; }
    .badge { font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); margin:0 0 8px; }
    .kv { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); }
    .btn.logout { min-height:42px; border-radius:999px; padding:8px 14px; display:inline-flex; align-items:center; gap:7px; background:linear-gradient(135deg,#ff6b6b,#ff8bd4); border:0; color:#fff; font:700 11px Comfortaa,sans-serif; }
  </style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="gate" class="gate layer">
  <div class="glass card">
    <p class="badge">SIDHI • GYM LOG</p>
    <h1 class="brand">Sidhi <span>Gym</span></h1>
    <p class="sub" id="gateHint">Premium gym access.</p>
    <label>username</label><input id="loginUser" autocomplete="username" placeholder="harry" />
    <label>password (min 4)</label><input id="loginPass" type="password" autocomplete="current-password" />
    <button type="button" class="forgot" id="forgotBtn">forgot password</button>
    <div class="row auth-actions">
      <button class="btn full" id="loginBtn">ENTER</button>
      <button class="btn ghost full" id="setupBtn">CREATE ACCOUNT →</button>
    </div>
    <div class="creator" data-creator></div>
  </div>
</div>
<div id="app" class="wrap layer hidden">
  <div class="row" style="justify-content:space-between;margin-bottom:12px">
    <div>
      <p class="badge">SIDHI GYM</p>
      <p class="hello" id="hello"></p>
    </div>
    <button class="btn logout" id="logoutBtn" type="button">logout</button>
  </div>
  <div id="view-home"></div>
  <div id="view-workout" class="hidden"></div>
  <div id="view-progress" class="hidden"></div>
  <div id="view-history" class="hidden"></div>
</div>
<nav class="tabbar hidden" id="tabbar"></nav>
<div class="toast" id="toast"></div>
<script src="app.js?v=12"></script>
<script src="graph-foot.js?v=7"></script>
</body></html>
