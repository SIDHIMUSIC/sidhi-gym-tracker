<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sidhi Gym</title>
  <meta name="theme-color" content="#070b12" />
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Pacifico&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --gold:#f0c27a; --mint:#63e2b3; --text:#f6f1e8; --muted:#9aa7b8; --line:rgba(255,255,255,.14); --bg:#070b12; }
    * { box-sizing: border-box; }
    html, body { margin:0; min-height:100%; color:var(--text); font-family:Comfortaa,system-ui,sans-serif; background:var(--bg); }
    .layer { position:relative; z-index:1; }
    .brand span { background:linear-gradient(90deg,#ff8bd4,#f0c27a,#63e2b3); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .sub { color:var(--muted); }
    .glass { background:rgba(16,24,34,.42); border:1px solid var(--line); border-radius:28px; }
    .card { padding:16px; margin:0 0 14px; }
    .btn { border:0; border-radius:999px; min-height:48px; padding:12px 16px; font:700 14px Comfortaa,sans-serif; color:#120d06; background:linear-gradient(135deg,#ff9a9e,#f0c27a); }
    .btn.ghost { background:rgba(255,255,255,.08); color:#fff; }
    .btn.ok { background:linear-gradient(135deg,#a8edea,#63e2b3); }
    .btn.danger { background:#c0392b; color:#fff; }
    .btn.full { flex:1; width:100%; }
    label { display:block; font-size:12px; color:#d7c4ff; margin:8px 0 4px; }
    input, textarea { width:100%; padding:12px; border-radius:16px; border:1px solid var(--line); background:rgba(8,14,22,.55); color:var(--text); }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .hidden { display:none !important; }
    .gate { min-height:100vh; display:grid; place-items:center; padding:22px 14px; }
    .tabbar { position:fixed; left:10px; right:10px; bottom:8px; z-index:15; display:flex; padding:8px; background:rgba(10,16,24,.72); border-radius:28px; }
    .tab { flex:1; background:none; border:0; color:var(--muted); }
    .tab.on { color:#120d06; background:linear-gradient(135deg,#ff9a9e,#f0c27a,#63e2b3); }
    .toast { position:fixed; bottom:92px; left:50%; transform:translateX(-50%); display:none; z-index:20; background:#14202c; color:#f0c27a; padding:10px 14px; border-radius:999px; }
    .wrap { max-width:860px; margin:0 auto; padding:14px 14px 118px; }
    .actions { display:flex; gap:8px; }
    .stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
    .kv { display:flex; justify-content:space-between; padding:8px 0; }
    .btn.logout { min-height:42px; background:linear-gradient(135deg,#ff6b6b,#ff8bd4); color:#fff; border:0; }
    .cal { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
    .hero-kg { font:800 42px Comfortaa,sans-serif; }
    table { width:100%; }
  </style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="gate" class="gate layer"><div class="glass card"><h1 class="brand">Sidhi <span>Gym</span></h1><p class="sub" id="gateHint">Login</p><label>username</label><input id="loginUser" /><label>password</label><input id="loginPass" type="password" /><div class="row"><button class="btn full" id="loginBtn">enter</button><button class="btn ghost full" id="setupBtn">create</button></div></div></div>
<div id="app" class="wrap layer hidden">
<div class="row" style="justify-content:space-between"><div><p class="hello" id="hello"></p></div><button class="btn logout" id="logoutBtn">logout</button></div>
<div id="view-home"><div class="hero-kg" id="homeKg">- kg</div><p class="sub" id="homeWeek"></p><div class="stats"><div class="glass stat"><b id="stStreak">0</b></div><div class="glass stat"><b id="stWorkouts">0</b></div><div class="glass stat"><b id="stGoal">-</b></div></div><div class="glass card"><p class="pill" id="homeSplit"></p><div class="kv"><span>w</span><b id="homeW">-</b></div><div class="kv"><span>dur</span><b id="homeDur">-</b></div><div class="kv"><span>tm</span><b id="homeTm">-</b></div><button class="btn ok full" id="homeFinish">finish</button></div><canvas id="homeChart" width="640" height="180"></canvas></div>
<div id="view-workout" class="hidden"><div id="dateLine"></div><div id="splitLine" class="pill"></div><input type="date" id="date" /><div id="offNote" class="hidden"></div><input type="time" id="entryTime" /><input id="entryWeight" /><input type="time" id="after1HourTime" /><textarea id="after1HourNote"></textarea><input type="time" id="beforeTreadmillTime" /><input id="beforeTreadmillKm" /><input id="beforeTreadmillMins" /><input id="beforeTreadmillSpeed" /><textarea id="beforeTreadmillNote"></textarea><input type="time" id="afterTreadmillTime" /><input id="afterTreadmillKm" /><input id="afterTreadmillMins" /><input id="afterTreadmillSpeed" /><input id="afterTreadmillIncline" /><textarea id="afterTreadmillNote"></textarea><input id="afterTreadmillWeight" /><button class="btn" id="saveBtn">save</button><button class="btn ok" id="finishBtn">finish</button><div id="resultText"></div><p id="resultSub"></p><p id="tmResult"></p></div>
<div id="view-progress" class="hidden"><button id="calPrev">&lt;</button><b id="calTitle"></b><button id="calNext">&gt;</button><div class="cal" id="cal"></div><input id="goalWeight" /><button id="goalBtn">goal</button><canvas id="progChart" width="640" height="200"></canvas></div>
<div id="view-history" class="hidden"><tbody id="hist"></tbody></div>
</div>
<nav class="tabbar hidden" id="tabbar"><button class="tab on" data-tab="home">home</button><button class="tab" data-tab="workout">workout</button><button class="tab" data-tab="progress">progress</button><button class="tab" data-tab="history">history</button></nav>
<div class="toast" id="toast"></div>
<script src="app.js?v=11"></script>
<script src="run-ui.js?v=12"></script>
<script src="run.js?v=12"></script>
</body></html>
