<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sidhi Gym Tracker</title>
  <meta name="theme-color" content="#0b1220" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #071018;
      --card: #101a26;
      --line: #1e2d3d;
      --gold: #e8b86d;
      --mint: #7ee0b1;
      --rose: #ff8b8b;
      --text: #f3f1ea;
      --muted: #9aa8b6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(1200px 500px at 10% -10%, #16324a 0%, transparent 55%),
        radial-gradient(900px 400px at 110% 0%, #3a2612 0%, transparent 50%),
        var(--bg);
      color: var(--text);
      font-family: Hind, system-ui, sans-serif;
    }
    h1, h2, .brand { font-family: Syne, Hind, sans-serif; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 20px 16px 80px; }
    .top {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      margin-bottom: 18px;
    }
    .brand { margin: 0; font-size: 28px; letter-spacing: .3px; }
    .brand span { color: var(--gold); }
    .sub { color: var(--muted); margin: 4px 0 0; font-size: 14px; }
    .btn {
      border: 0; border-radius: 12px; padding: 10px 14px; cursor: pointer;
      font-weight: 600; font-family: inherit; color: #081018;
      background: linear-gradient(180deg, #f2d39a, var(--gold));
    }
    .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
    .btn.danger { background: #5a1d1d; color: #ffd4d4; }
    .btn.ok { background: linear-gradient(180deg, #9ff0c6, var(--mint)); }
    .card {
      background: color-mix(in srgb, var(--card) 88%, transparent);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      backdrop-filter: blur(8px);
    }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .stat { padding: 12px; border-radius: 14px; background: #0c1622; border: 1px solid var(--line); }
    .stat b { display: block; font-size: 22px; }
    .stat small { color: var(--muted); }
    label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 6px; }
    input, select, textarea {
      width: 100%; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line);
      background: #0b141e; color: var(--text); font: inherit;
    }
    textarea { min-height: 72px; resize: vertical; }
    .steps { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; }
    .chip {
      flex: 0 0 auto; border: 1px solid var(--line); background: #0c1622; color: var(--muted);
      border-radius: 999px; padding: 7px 11px; cursor: pointer; font-size: 13px;
    }
    .chip.on { color: #081018; background: var(--gold); border-color: var(--gold); font-weight: 700; }
    .row { display: flex; gap: 8px; align-items: end; }
    .row > * { flex: 1; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
    .muted { color: var(--muted); }
    .hidden { display: none !important; }
    .gate { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
    .gate .card { width: min(420px, 100%); }
    .toast {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      background: #123; border: 1px solid var(--gold); color: var(--gold);
      padding: 10px 14px; border-radius: 999px; display: none; z-index: 20;
    }
    canvas { width: 100%; height: 160px; }
    @media (max-width: 720px) {
      .stats, .grid { grid-template-columns: 1fr; }
      .brand { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div id="gate" class="gate">
    <div class="card">
      <h1 class="brand">Sidhi <span>Gym</span></h1>
      <p class="sub" id="gateHint">Apna alag ID aur password banao. Ye public signup nahi hai.</p>
      <label>ID / naam</label>
      <input id="loginUser" autocomplete="username" />
      <label>Password</label>
      <input id="loginPass" type="password" autocomplete="current-password" />
      <div class="row" style="margin-top:14px">
        <button class="btn" id="loginBtn">Enter</button>
        <button class="btn ghost" id="setupBtn">Pehli baar set karo</button>
      </div>
    </div>
  </div>
  <div id="app" class="wrap hidden">
    <div class="top">
      <div>
        <h1 class="brand">Sidhi <span>Gym Tracker</span></h1>
        <p class="sub" id="hello"></p>
      </div>
      <button class="btn ghost" id="logoutBtn">Lock</button>
    </div>
    <div class="stats">
      <div class="stat"><small>Sessions</small><b id="sCount">0</b></div>
      <div class="stat"><small>Last body weight</small><b id="sWeight">-</b></div>
      <div class="stat"><small>Last gym</small><b id="sDate">-</b></div>
    </div>
    <div class="card">
      <h2 style="margin:0 0 8px;font-size:18px">Body weight trend</h2>
      <canvas id="chart" height="160"></canvas>
    </div>
    <div class="card">
      <h2 style="margin:0 0 10px;font-size:18px">Aaj ka session</h2>
      <div class="grid">
        <div><label>Date</label><input type="date" id="date" /></div>
        <div><label>Saath me (optional)</label><input id="partner" placeholder="Priya / koi aur" /></div>
      </div>
      <div class="steps" id="steps"></div>
      <div id="stepBox"></div>
      <div class="row" style="margin-top:12px">
        <button class="btn ok" id="saveBtn">Session save karo</button>
        <button class="btn ghost" id="resetBtn">Form clear</button>
      </div>
    </div>
    <div class="card">
      <h2 style="margin:0 0 10px;font-size:18px">History</h2>
      <div style="overflow:auto">
        <table>
          <thead><tr><th>Date</th><th>Weight</th><th>Walk</th><th>TM</th><th></th></tr></thead>
          <tbody id="hist"></tbody>
        </table>
      </div>
    </div>
    <div class="card">
      <h2 style="margin:0 0 10px;font-size:18px">Backup</h2>
      <p class="muted">Data isi browser me rehta hai. Phone change se pehle Export lo.</p>
      <div class="row">
        <button class="btn" id="exportBtn">Export JSON</button>
        <button class="btn ghost" id="importBtn">Import JSON</button>
        <button class="btn danger" id="wipeBtn">Saara data mitao</button>
      </div>
      <input type="file" id="file" accept="application/json" class="hidden" />
    </div>
  </div>
  <div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
