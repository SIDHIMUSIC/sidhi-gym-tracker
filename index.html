<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sidhi Gym</title>
  <meta name="theme-color" content="#070b12" />
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Pacifico&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --gold:#f0c27a; --gold2:#c9923d; --mint:#63e2b3; --text:#f6f1e8; --muted:#9aa7b8; --line:rgba(255,255,255,.14); --bg:#070b12; }
    * { box-sizing: border-box; }
    html, body { margin:0; min-height:100%; color:var(--text); font-family:Comfortaa,system-ui,sans-serif; background:var(--bg); }
    .layer { position:relative; z-index:1; }
    h1,h2,.brand { font-family:Syne,Comfortaa,sans-serif; }
    .brand span { background:linear-gradient(90deg,#ff8bd4,#f0c27a,#63e2b3); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .sub { color:var(--muted); margin:6px 0 0; }
    .hello { font-family:Pacifico,cursive; font-size:22px; margin:6px 0 0; }
    .glass { background:rgba(16,24,34,.42); border:1px solid var(--line); border-radius:28px; }
    .card { padding:16px; margin:0 0 14px; }
    .btn { border:0; border-radius:999px; min-height:52px; padding:14px 18px; cursor:pointer; font:700 14px Comfortaa,sans-serif; color:#120d06; background:linear-gradient(135deg,#ff9a9e,#f0c27a); }
    .btn.ghost { background:rgba(255,255,255,.08); color:#fff; }
    .btn.ok { background:linear-gradient(135deg,#a8edea,#63e2b3); }
    .btn.danger { background:linear-gradient(135deg,#ff6b6b,#c0392b); color:#fff; }
    .btn.full { flex:1; width:100%; }
    label { display:block; font-size:12px; color:#d7c4ff; margin:10px 0 6px; }
    input, textarea { width:100%; padding:14px 13px; border-radius:16px; border:1px solid var(--line); background:rgba(8,14,22,.55); color:var(--text); font:inherit; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .pill { display:inline-flex; padding:7px 12px; border-radius:999px; background:rgba(240,194,122,.12); color:var(--gold); font-weight:800; }
    .hidden { display:none !important; }
    .gate { min-height:100vh; display:grid; place-items:center; padding:22px 14px; }
    .tabbar { position:fixed; left:10px; right:10px; bottom:8px; z-index:15; display:flex; padding:8px; background:rgba(10,16,24,.72); border-radius:28px; }
    .tab { flex:1; background:none; border:0; color:var(--muted); font:700 10px Comfortaa,sans-serif; padding:8px 0; }
    .tab.on { color:#120d06; background:linear-gradient(135deg,#ff9a9e,#f0c27a,#63e2b3); }
    .toast { position:fixed; bottom:92px; left:50%; transform:translateX(-50%); background:#14202c; border:1px solid var(--gold); color:var(--gold); padding:10px 14px; border-radius:999px; display:none; z-index:20; }
    .wrap { max-width:860px; margin:0 auto; padding:14px 14px 118px; }
    .actions { display:flex; gap:8px; padding:10px 0; }
    .stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
    .stat { text-align:center; padding:12px 6px; }
    .kv { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); }
    .btn.logout { min-height:42px; border-radius:999px; padding:8px 14px; background:linear-gradient(135deg,#ff6b6b,#ff8bd4); border:0; color:#fff; }
    .cal { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; text-align:center; }
    .cal .c { aspect-ratio:1; border-radius:50%; display:grid; place-items:center; background:rgba(255,255,255,.04); }
    .cal .c.done { background:#1e8a55; color:#fff; }
    .hero-kg { font:800 42px Comfortaa,sans-serif; }
    .badge { font-size:11px; letter-spacing:.16em; color:var(--gold); }
    h2 { color:#ffe4b5; font-size:17px; }
    table { width:100%; border-collapse:collapse; }
    th,td { padding:10px 6px; border-bottom:1px solid var(--line); text-align:left; }
  </style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="gate" class="gate layer"><div class="glass card"><p class="badge">SIDHI GYM</p><h1 class="brand">Sidhi <span>Gym</span></h1><p class="sub" id="gateHint">Login stays until Logout.</p><label>username</label><input id="loginUser" /><label>password</label><input id="loginPass" type="password" /><div class="row" style="margin-top:16px"><button class="btn full" id="loginBtn">enter</button><button class="btn ghost full" id="setupBtn">create account</button></div></div></div>
<div id="app" class="wrap layer hidden">
  <div class="row" style="justify-content:space-between;margin-bottom:12px"><div><p class="badge">SIDHI GYM</p><p class="hello" id="hello"></p></div><button class="btn logout" id="logoutBtn" type="button">logout</button></div>
  <div id="view-home"><div class="glass card" style="text-align:center"><div class="hero-kg" id="homeKg">- kg</div><p class="sub" id="homeWeek">this week</p></div><div class="stats"><div class="glass stat"><b id="stStreak">0</b><span>streak</span></div><div class="glass stat"><b id="stWorkouts">0</b><span>workouts</span></div><div class="glass stat"><b id="stGoal">-</b><span>goal</span></div></div><div class="glass card"><h2>today</h2><p class="pill" id="homeSplit"></p><div class="kv"><span>weight</span><b id="homeW">-</b></div><div class="kv"><span>duration</span><b id="homeDur">-</b></div><div class="kv"><span>treadmill</span><b id="homeTm">-</b></div><button class="btn ok full" id="homeFinish">finish workout</button></div><div class="glass card"><canvas id="homeChart" width="640" height="180" style="width:100%;height:140px"></canvas></div></div>
  <div id="view-workout" class="hidden"><div class="glass card"><div id="dateLine"></div><div id="splitLine" class="pill"></div><label>date</label><input type="date" id="date" /><div id="offNote" class="hidden sub">Sunday rest.</div></div><div class="glass card"><h2>1 gym entry</h2><div class="grid"><div><label>time</label><input type="time" id="entryTime" /></div><div><label>weight</label><input id="entryWeight" /></div></div></div><div class="glass card"><h2>2 workout</h2><input type="time" id="after1HourTime" /><textarea id="after1HourNote"></textarea></div><div class="glass card"><h2>3 treadmill</h2><div class="grid"><input type="time" id="beforeTreadmillTime" /><input id="beforeTreadmillKm" placeholder="km" /><input id="beforeTreadmillMins" placeholder="mins" /><input id="beforeTreadmillSpeed" placeholder="speed" /></div><textarea id="beforeTreadmillNote"></textarea></div><div class="glass card"><h2>4 incline</h2><div class="grid"><input type="time" id="afterTreadmillTime" /><input id="afterTreadmillKm" /><input id="afterTreadmillMins" /><input id="afterTreadmillSpeed" /><input id="afterTreadmillIncline" placeholder="incline" /></div><textarea id="afterTreadmillNote"></textarea></div><div class="glass card"><h2>5 end weight</h2><input id="afterTreadmillWeight" /></div><div class="actions"><button class="btn full" id="saveBtn">save</button><button class="btn ok full" id="finishBtn">finish</button></div><div class="glass card"><div id="resultText" class="today-box">Add start weight</div><p class="sub" id="resultSub"></p><p class="sub" id="tmResult"></p></div></div>
  <div id="view-progress" class="hidden"><div class="glass card"><h2>calendar</h2><button class="btn ghost" id="calPrev">&lt;</button><b id="calTitle"></b><button class="btn ghost" id="calNext">&gt;</button><div class="cal" id="cal"></div></div><div class="glass card"><h2>goal</h2><input id="goalWeight" /><button class="btn" id="goalBtn">save goal</button></div><div class="glass card"><canvas id="progChart" width="640" height="200" style="width:100%;height:160px"></canvas></div></div>
  <div id="view-history" class="hidden"><div class="glass card"><h2>history</h2><table><thead><tr><th>date</th><th>workout</th><th>weight</th><th></th></tr></thead><tbody id="hist"></tbody></table></div></div>
</div>
<nav class="tabbar hidden" id="tabbar"><button class="tab on" data-tab="home">home</button><button class="tab" data-tab="workout">workout</button><button class="tab" data-tab="progress">progress</button><button class="tab" data-tab="history">history</button></nav>
<div class="toast" id="toast"></div>
<script src="app.js?v=11"></script>
<script src="run-ui.js?v=12"></script>
<script src="run.js?v=12"></script>
</body></html>
